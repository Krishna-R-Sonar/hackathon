services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: graph_agent_memory_falkordb
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--appendonly yes
    ports:
      # Localhost-only binding to prevent public exposure
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      # Named persistent volume to ensure durability across restarts
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  falkordb_data:
    name: graph_agent_memory_falkordb_data
